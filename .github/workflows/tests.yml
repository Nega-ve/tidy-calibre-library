name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - uses: actions/cache@v6
        with:
          path: ~/.cache/tidy-calibre-library/words.txt
          key: scowl-2020.12.07
      - run: pip install -e ".[dev]"
      - run: pytest
      - name: The installed command runs outside the repo
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/pip" install .
          cd "$RUNNER_TEMP"
          clean/bin/tidy-calibre-library --help
